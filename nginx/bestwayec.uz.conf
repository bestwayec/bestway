# Frontend: https://bestwayec.uz + https://www.bestwayec.uz
# Install: sudo cp nginx/bestwayec.uz.conf /etc/nginx/sites-available/bestwayec.uz
#          sudo ln -s /etc/nginx/sites-available/bestwayec.uz /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
# SSL: sudo certbot --nginx -d bestwayec.uz -d www.bestwayec.uz
server {
    listen 80;
    server_name bestwayec.uz www.bestwayec.uz;

    # 500MB video upload goes via Next.js proxy (/api/backend/*),
    # so frontend must allow it too (backend MAX_UPLOAD_MB=500).
    client_max_body_size 520m;

    # Security headers (HSTS is added by certbot HTTPS block after TLS).
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ~* \.(m3u8|ts)$ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        add_header Cache-Control "max-age=86400";
        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp2t ts;
        }
    }

    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Large uploads (500MB) need long timeouts: Next proxy allows 600s.
        proxy_connect_timeout 10s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }
}
