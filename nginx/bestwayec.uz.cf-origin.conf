# Frontend: https://bestwayec.uz + https://www.bestwayec.uz
# Cloudflare Full (strict) variant — REPLACES nginx/bestwayec.uz.conf on the VPS.
# Original kept in repo for reference; install THIS file on Cloudflare-fronted servers.
#
# Prerequisites (VPS shell, once):
#   1. Cloudflare dashboard → SSL/TLS → Origin Server → Create Certificate
#      hostnames: bestwayec.uz, *.bestwayec.uz — validity 15 years — key format PEM.
#   2. Save as /etc/nginx/ssl/cf-origin.pem + /etc/nginx/ssl/cf-origin-key.pem (chmod 600).
#   3. Cloudflare dashboard → SSL/TLS → Overview → encryption mode: Full (strict).
#   4. DNS: A @ and www → VPS_IP, Proxy status ON (orange cloud).
#      SSL/TLS → Edge Certificates → Always Use HTTPS: ON.
# Install: sudo cp nginx/bestwayec.uz.cf-origin.conf /etc/nginx/sites-available/bestwayec.uz
#          sudo ln -s /etc/nginx/sites-available/bestwayec.uz /etc/nginx/sites-enabled/
#          sudo cp nginx/cloudflare-ips.conf /etc/nginx/conf.d/cloudflare-ips.conf
#          sudo nginx -t && sudo systemctl reload nginx
#
# Limits (Cloudflare Free, verified Oct 2026 — https://developers.cloudflare.com/fundamentals/reference/connection-limits/):
#   - Max proxied upload 100MB. Files above that MUST use direct-api.bestwayec.uz (grey cloud).
#     Hence client_max_body_size 100m here (not 520m) so oversized posts fail fast at Nginx
#     with a clear 413 instead of hanging into a Cloudflare 524/413.
#   - Proxy Read Timeout 125s / Write 30s at Cloudflare → keep Nginx timeouts <= those.

server {
    listen 80;
    server_name bestwayec.uz www.bestwayec.uz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name bestwayec.uz www.bestwayec.uz;

    ssl_certificate /etc/nginx/ssl/cf-origin.pem;
    ssl_certificate_key /etc/nginx/ssl/cf-origin-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Proxied uploads capped by Cloudflare Free at 100MB — fail fast locally.
    client_max_body_size 100m;

    location ~* \.(m3u8|ts)$ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        add_header Cache-Control "max-age=86400";
        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp2t ts;
        }
    }

    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Behind Cloudflare the client is always HTTPS even though Nginx sees CF's TLS.
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;

        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 120s;
    }
}
