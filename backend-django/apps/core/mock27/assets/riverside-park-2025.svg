<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 470" width="600" height="470" role="img" aria-labelledby="t2025 d2025"><title id="t2025">Riverside Park, 2025</title><desc id="d2025">Plan of Riverside Park in 2025: same entrance and pond; café instead of the picnic area, a smaller lawn inside a circular walking path, a boardwalk beside the pond, a larger playground and bicycle parking along the south.</desc><rect x="0" y="0" width="600" height="470" fill="#ffffff"/><text x="300" y="30" text-anchor="middle" font-size="20" font-weight="700" font-family="Inter, 'Segoe UI', Arial, sans-serif" fill="#1f2937" stroke="#ffffff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">Riverside Park, 2025</text><rect x="30" y="55" width="540" height="370" rx="4" fill="#e6f2dc" stroke="#374151" stroke-width="2" /><rect x="64" y="422" width="32" height="6" fill="#ffffff"/><path d="M 68 437 L 80 427 L 92 437" fill="none" stroke="#1f2937" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="455" text-anchor="middle" font-size="14" font-weight="700" font-family="Inter, 'Segoe UI', Arial, sans-serif" fill="#1f2937" stroke="#ffffff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">Entrance</text><ellipse cx="480" cy="118" rx="70" ry="42" fill="#a9d3ee" stroke="#4b8fb8" stroke-width="2"/><text x="480" y="123" text-anchor="middle" font-size="14" font-weight="600" font-family="Inter, 'Segoe UI', Arial, sans-serif" fill="#1f2937" stroke="#ffffff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">Pond</text><g transform="translate(548 44)"><path d="M0 -16 L7 8 L0 3 L-7 8 Z" fill="#1f2937"/><text x="14" y="4" font-size="14" font-weight="700" font-family="Inter, 'Segoe UI', Arial, sans-serif" fill="#1f2937">N</text></g><g transform="translate(470 452)"><rect x="0" y="-5" width="60" height="6" fill="#1f2937"/><text x="68" y="2" font-size="12" font-family="Inter, 'Segoe UI', Arial, sans-serif" fill="#1f2937">50 m</text>