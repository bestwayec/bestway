# Microservices architecture for Education Center System
# Services: postgres + db-migrator + backend (Django) + frontend (Next.js) + cache + workers
name: bestway-prod

services:
  postgres:
    image: postgres:17.11-alpine
    container_name: education-postgres
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in environment or .env file}
      POSTGRES_DB: education_center
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d education_center"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - education-net

  django-cache:
    image: redis:8.2.10-alpine
    container_name: education-cache
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "96mb", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - education-net

  db-migrator:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: education-db-migrator
    restart: "no"
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in environment or .env file}@postgres:5432/education_center?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - education-net

  backend:
    build:
      context: ./backend-django
    image: bestway-django:local
    container_name: education-backend
    restart: unless-stopped
    init: true
    command: ["gunicorn", "config.wsgi:application", "--bind", "0.0.0.0:3001", "--workers", "2", "--threads", "2", "--timeout", "120", "--access-logfile", "-", "--error-logfile", "-"]
    mem_limit: 1g
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    depends_on:
      postgres:
        condition: service_healthy
      django-cache:
        condition: service_healthy
      db-migrator:
        condition: service_completed_successfully
    env_file:
      - ./backend-django/.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      HEALTHCHECK_PORT: "3001"
      STORAGE_DIR: /app/storage
      BUILD_COMMIT: ${BUILD_COMMIT:-unknown}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in environment or .env file}@postgres:5432/education_center?schema=public
      REDIS_URL: redis://django-cache:6379/0
      SECURE_SSL_REDIRECT: "false"
      TRUST_PROXY_SSL_HEADER: "true"
      PORT: 3001
      CORS_ORIGIN: https://bestwayec.uz,https://www.bestwayec.uz
      PUBLIC_URL: https://api.bestwayec.uz
      DESKTOP_LATEST_VERSION: ${DESKTOP_LATEST_VERSION:-0.5.8}
      DESKTOP_DOWNLOAD_URL: ${DESKTOP_DOWNLOAD_URL:-https://github.com/bestwayec/bw-tauri/releases/download/bestway-app-v0.5.8/Bestway.App_0.5.8_x64-setup.exe}
      DESKTOP_PRERELEASE: "false"
    ports:
      - "127.0.0.1:3001:3001"
      - "127.0.0.1:8001:3001"
    volumes:
      - backend_storage:/app/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:3001/v1/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    networks:
      education-net:
        aliases:
          - django-api

  assessment-worker:
    build:
      context: ./backend-django
    image: bestway-django:local
    restart: unless-stopped
    init: true
    command: ["python", "manage.py", "run_assessment_worker"]
    mem_limit: 2g
    cpus: 1.0
    env_file:
      - ./backend-django/.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      STORAGE_DIR: /app/storage
      BUILD_COMMIT: ${BUILD_COMMIT:-unknown}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in environment or .env file}@postgres:5432/education_center?schema=public
      REDIS_URL: redis://django-cache:6379/0
      SECURE_SSL_REDIRECT: "false"
      TRUST_PROXY_SSL_HEADER: "true"
    volumes:
      - backend_storage:/app/storage
      - assessment_models:/app/model-cache
    depends_on:
      postgres:
        condition: service_healthy
      django-cache:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - education-net

  game-scheduler:
    build:
      context: ./backend-django
    image: bestway-django:local
    restart: unless-stopped
    init: true
    command: ["python", "manage.py", "run_game_scheduler"]
    mem_limit: 256m
    cpus: 0.25
    env_file:
      - ./backend-django/.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      STORAGE_DIR: /app/storage
      BUILD_COMMIT: ${BUILD_COMMIT:-unknown}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in environment or .env file}@postgres:5432/education_center?schema=public
      REDIS_URL: redis://django-cache:6379/0
      SECURE_SSL_REDIRECT: "false"
      TRUST_PROXY_SSL_HEADER: "true"
    volumes:
      - backend_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      django-cache:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - education-net

  telegram-bot:
    build:
      context: ./backend-django
    image: bestway-django:local
    restart: unless-stopped
    init: true
    command: ["python", "manage.py", "run_telegram_bot"]
    mem_limit: 256m
    cpus: 0.25
    env_file:
      - ./backend-django/.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      STORAGE_DIR: /app/storage
      BUILD_COMMIT: ${BUILD_COMMIT:-unknown}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in environment or .env file}@postgres:5432/education_center?schema=public
      REDIS_URL: redis://django-cache:6379/0
      SECURE_SSL_REDIRECT: "false"
      TRUST_PROXY_SSL_HEADER: "true"
      TELEGRAM_MODE: "polling"
    volumes:
      - backend_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      django-cache:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - education-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        API_URL: http://backend:3001/v1
    container_name: education-frontend
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      API_URL: http://backend:3001/v1
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
    ports:
      - "127.0.0.1:3005:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - education-net

volumes:
  pgdata:
    name: education_pgdata
  backend_storage:
    name: education_backend_storage
  assessment_models:

networks:
  education-net:
    name: education-net
    driver: bridge
