name: CI
on:
  pull_request:
    branches: [main, migration/django-backend]
  push:
    branches: [main, migration/django-backend]
permissions:
  contents: read
jobs:
  django:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend-django
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/education_center?schema=public
      DJANGO_SECRET_KEY: ci-only-bestway-django-secret-long-enough-for-production-checks-987654321
      JWT_SECRET: ci-only-bestway-jwt-secret-987654321
      ALLOWED_HOSTS: api.bestwayec.uz,django-api
      CORS_ALLOWED_ORIGINS: https://bestwayec.uz,https://www.bestwayec.uz
      REDIS_URL: redis://localhost:6379/0
      PUBLIC_URL: https://api.bestwayec.uz
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: education_center
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d education_center"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8.2.10-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend-django/requirements/*.txt
      - name: Setup Node for reference differential tests
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.13.0"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Build Nest reference for differential regressions
        working-directory: backend
        run: |
          npm ci
          npx prisma generate
          npx prisma migrate deploy
          npm run build
      - name: Install Django dependencies
        run: python -m pip install -r requirements/dev.txt -r requirements/prod.txt
      - name: Django regressions
        env:
          CORS_ALLOWED_ORIGINS: http://localhost:3000
        run: python -m pytest
      - name: Match PostgreSQL dump client to the database server
        run: |
          mkdir -p "$RUNNER_TEMP/pg-client"
          cat > "$RUNNER_TEMP/pg-client/pg_dump" <<'SH'
          #!/usr/bin/env bash
          exec docker run --rm --network host -e PGPASSWORD postgres:17.11-alpine pg_dump "$@"
          SH
          chmod +x "$RUNNER_TEMP/pg-client/pg_dump"
          echo "$RUNNER_TEMP/pg-client" >> "$GITHUB_PATH"
      - name: Verify actual Django HTTP and worker integration
        run: |
          VERIFY_REPORT_DIR="$RUNNER_TEMP/bestway-http" python scripts/verify_release_http.py
          VERIFY_REPORT_DIR="$RUNNER_TEMP/bestway-workers" python scripts/verify_release_workers.py
      - name: Check authoritative migration ledger and Django schema
        run: python manage.py check_legacy_schema --settings=config.settings.production
      - name: Verify authoritative Prisma migration manifest
        run: python -m common.schema_validation ../backend/prisma/migrations
      - name: Check production security configuration
        run: python manage.py check --deploy --fail-level WARNING --settings=config.settings.production
      - name: Check shared cache
        run: |
          DJANGO_SETTINGS_MODULE=config.settings.production python - <<'PY'
          import django
          django.setup()
          from django.core.cache import cache
          cache.set('ci-cache-check', 'ok', 10)
          assert cache.get('ci-cache-check') == 'ok'
          cache.delete('ci-cache-check')
          PY
      - name: Check deploy scripts and production container configuration
        env:
          POSTGRES_PASSWORD: postgres
        run: |
          bash -n scripts/deploy_django.sh
          sh -n config/docker-entrypoint.sh
          cat > .env <<'ENV'
          DATABASE_URL=postgresql://postgres:postgres@postgres:5432/education_center?schema=public
          DJANGO_SECRET_KEY=ci-only-bestway-django-secret-long-enough-for-production-checks-987654321
          JWT_SECRET=ci-only-bestway-jwt-secret-987654321
          ALLOWED_HOSTS=api.bestwayec.uz,django-api,backend
          CORS_ALLOWED_ORIGINS=https://bestwayec.uz,https://www.bestwayec.uz
          PUBLIC_URL=https://api.bestwayec.uz
          TELEGRAM_MODE=off
          ASSESSMENT_WORKER_ENABLED=false
          ENV
          docker compose -f ../docker-compose.django.yml --profile workers config --quiet
          docker compose -f ../docker-compose.django.yml -f ../docker-compose.django.cutover.yml --profile workers config --quiet
      - name: Build and verify the actual Django API and worker containers
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker network create education-net
          docker network connect --alias postgres education-net "$POSTGRES_CONTAINER"
          docker volume create education_backend_storage
          docker compose -f ../docker-compose.django.yml up -d --build --wait --wait-timeout 180 django-cache django-api
          docker compose -f ../docker-compose.django.yml exec -T django-api python -m config.healthcheck
          docker compose -f ../docker-compose.django.yml --profile workers run --rm --no-deps assessment-worker python manage.py run_assessment_worker --once
          docker compose -f ../docker-compose.django.yml --profile workers run --rm --no-deps game-scheduler python manage.py run_game_scheduler --once
      - name: Stop CI verification containers
        if: always()
        run: docker compose -f ../docker-compose.django.yml --profile workers down || true
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: education_center
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d education_center"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/education_center?schema=public
      PORT: 3001
      JWT_SECRET: ci-test-jwt-secret-0123456789abcdef
      STREAM_TOKEN_SECRET: ci-test-stream-secret-0123456789ab
      CORS_ORIGIN: http://localhost:3005
      SMOKE_BASE_URL: http://localhost:3001/v1
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.13.0"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Prisma generate
        run: npx prisma generate
      - name: Prisma migrate deploy
        run: npx prisma migrate deploy
      - name: Seed demo data
        # test:smoke logs in as demo users (super_admin/admin/teacher/...)
        # which only exist after the demo seed — seed defaults match CI env.
        run: npm run seed
      - name: Seed CI demo test
        # smoke TESTS section needs the demo IELTS test, which prod seed
        # intentionally omits — CI-only recreation (idempotent).
        run: node scripts/ci-seed-demo-test.mjs
      - name: Build
        run: npm run build
      - name: Unit regressions
        run: npm test
      - name: Smoke test (built app)
        run: |
          npm run start:prod &
          echo $! > /tmp/backend.pid
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3001/v1/health; then
              echo "backend healthy"
              break
            fi
            if [ "$i" = "30" ]; then
              echo "backend did not become healthy in time"
              kill "$(cat /tmp/backend.pid)" || true
              exit 1
            fi
            sleep 2
          done
          npm run test:smoke
          kill "$(cat /tmp/backend.pid)"
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.13.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit regressions
        run: npm test
      - name: Build
        run: npm run build
