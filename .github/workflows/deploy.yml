name: Deploy to VPS

# Single-VPS Docker + Cloudflare deploy. Runs AFTER CI is green.
# Trigger: push to main (or manual dispatch). PRs do NOT deploy.
#
# Required GitHub secrets (repo Settings → Secrets → Actions):
#   VPS_HOST     — VPS IP or hostname (e.g. 203.0.113.10)
#   VPS_USER     — SSH user on VPS (e.g. deploy)
#   VPS_SSH_KEY  — private OpenSSH key for VPS_USER (no passphrase)
#   VPS_PATH     — repo path on VPS (default /opt/bestway if unset)
#
# VPS prerequisites (one-time, see docs/vps-cloudflare-runbook.md):
#   - repo cloned at $VPS_PATH, backend/.env + root .env present (chmod 600)
#   - host Nginx vhosts installed (*.cf-origin.conf + direct-api conf)
#   - docker compose up -d --build run at least once + seed:init done
#
# Safety notes:
#   - Migrations run automatically via the backend image entrypoint
#     (npx prisma migrate deploy && node dist/main.js). No separate migrate
#     step here, so there is exactly ONE migration runner (no race).
#   - Never `docker compose down` in CI — only up --wait (no dropped volumes).
#   - Rollback = git revert + push (re-deploys previous image).
#   - If main's history is ever rewritten (force-push), --ff-only can NEVER
#     succeed again; the script falls back to hard-syncing the checkout to
#     origin/main instead of wedging every future deploy. Untracked files
#     (backend/.env, root .env) are preserved because reset --hard does not
#     touch them.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        env:
          VPS_PATH: ${{ secrets.VPS_PATH }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: VPS_PATH
          script: |
            set -euo pipefail
            cd "${VPS_PATH:-/opt/bestway}"
            test -f ./backend/.env || { echo "backend/.env missing on VPS"; exit 1; }
            git fetch origin main
            if git merge --ff-only origin/main; then
              echo "checkout fast-forwarded to $(git rev-parse --short HEAD)"
            else
              echo "WARN: origin/main is not a fast-forward — history was rewritten upstream"
              echo "      checkout before: $(git rev-parse --short HEAD)"
              git reset --hard origin/main
              echo "      checkout after:  $(git rev-parse --short HEAD)"
            fi
            export BUILD_COMMIT="$(git rev-parse HEAD)"
            if [ -f docker-compose.prod.yml ]; then
              docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build --wait --wait-timeout 90
            else
              docker compose up -d --build --wait --wait-timeout 90
            fi
            # Local gates (fatal): reach services over the compose network.
            # No host ports are published in prod (tunnel-only), so check via exec.
            DC="docker compose -f docker-compose.yml -f docker-compose.prod.yml"
            $DC exec -T backend wget -qO- http://localhost:3001/v1/health > /dev/null
            $DC exec -T frontend wget -qO- http://localhost:3000/ > /dev/null
            # Public gates (warn-only): fail before DNS cutover / tunnel setup.
            curl -fsS --max-time 30 https://api.bestwayec.uz/v1/health > /dev/null \
              || echo "WARN: public api.bestwayec.uz not reachable (DNS/tunnel pending?)"
            curl -fsS --max-time 30 https://bestwayec.uz/ > /dev/null \
              || echo "WARN: public bestwayec.uz not reachable (DNS/tunnel pending?)"
            docker image prune -f
            docker compose ps
