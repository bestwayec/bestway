name: Deploy to VPS

# Single-VPS Docker + Cloudflare deploy. CI never starts a deployment.
# Manual dispatch, protected environment approval and successful main CI are required.
#
# Required GitHub secrets (repo Settings → Secrets → Actions):
#   VPS_HOST     — VPS IP or hostname (e.g. 203.0.113.10)
#   VPS_USER     — SSH user on VPS (e.g. deploy)
#   VPS_SSH_KEY  — private OpenSSH key for VPS_USER (no passphrase)
#   VPS_PATH     — repo path on VPS (default /opt/bestway if unset)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DEPLOY TO PRODUCTION to request a deployment
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: bestway-production-deploy
  cancel-in-progress: false

jobs:
  approval-preflight:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Require explicit request and configured production reviewers
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_CONFIRMATION: ${{ inputs.confirmation }}
        run: bash scripts/check-production-approval.sh
  deploy:
    needs: approval-preflight
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - name: Require successful main CI for the deployment commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh api "repos/$REPO/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=100" \
            --jq '.workflow_runs[].head_sha' | grep -Fx "$DEPLOY_SHA" >/dev/null \
            || { echo "No successful main CI run for this commit; deployment blocked"; exit 1; }
      - name: Prepare cached images on VPS
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          VPS_PATH: ${{ secrets.VPS_PATH }}
          DEPLOY_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 35m
          envs: VPS_PATH,DEPLOY_SHA
          script: |
            set -euo pipefail
            cd "${VPS_PATH:-/opt/bestway}"
            [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
            exec 8>"$(git rev-parse --git-dir)/bestway-deploy.lock"
            flock -n 8 || { echo "Another deployment is running"; exit 1; }
            git diff --quiet && git diff --cached --quiet
            git fetch origin main
            test "$(git rev-parse FETCH_HEAD)" = "$DEPLOY_SHA"               || { echo "main moved after this run was dispatched; dispatch again for the new head"; exit 1; }
            git merge --ff-only FETCH_HEAD
            flock -u 8
            bash scripts/deploy-release.sh prepare "$DEPLOY_SHA"
      - name: Activate and verify release
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          VPS_PATH: ${{ secrets.VPS_PATH }}
          DEPLOY_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 25m
          envs: VPS_PATH,DEPLOY_SHA
          script: |
            set -euo pipefail
            cd "${VPS_PATH:-/opt/bestway}"
            bash scripts/deploy-release.sh activate "$DEPLOY_SHA"
      - name: Verify public endpoints
        run: |
          set -euo pipefail
          for url in https://bestwayec.uz/ https://api.bestwayec.uz/v1/health; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' -L --max-time 20 --retry 10 --retry-delay 6 --retry-all-errors "$url" || true)
            echo "$url -> HTTP $code"
            [[ "$code" == 200 ]] || { echo "::error::$url did not return 200 after activation"; exit 1; }
          done
      - name: Deployment summary
        if: always()
        env:
          DEPLOY_SHA: ${{ github.sha }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "### Production deployment"
            echo "- Commit: \`$DEPLOY_SHA\`"
            echo "- Result: $JOB_STATUS"
            echo "- On failure after the container swap, scripts/deploy-release.sh restores the previous application images; migrations are not reversed and the verified backup path is in the step log."
          } >> "$GITHUB_STEP_SUMMARY"
