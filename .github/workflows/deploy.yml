name: Deploy to VPS

# Single-VPS Docker + Cloudflare deploy. CI never starts a deployment.
# Manual dispatch, protected environment approval and successful main CI are required.
#
# Required GitHub secrets (repo Settings → Secrets → Actions):
#   VPS_HOST     — VPS IP or hostname (e.g. 203.0.113.10)
#   VPS_USER     — SSH user on VPS (e.g. deploy)
#   VPS_SSH_KEY  — private OpenSSH key for VPS_USER (no passphrase)
#   VPS_PATH     — repo path on VPS (default /opt/bestway if unset)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DEPLOY TO PRODUCTION to request a deployment
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: bestway-production-deploy
  cancel-in-progress: false

jobs:
  approval-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Require explicit request and configured production reviewers
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_CONFIRMATION: ${{ inputs.confirmation }}
        run: bash scripts/check-production-approval.sh
  deploy:
    needs: approval-preflight
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Require successful main CI for the deployment commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh api "repos/$REPO/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=100" \
            --jq '.workflow_runs[].head_sha' | grep -Fx "$DEPLOY_SHA" >/dev/null \
            || { echo "No successful main CI run for this commit; deployment blocked"; exit 1; }
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        env:
          VPS_PATH: ${{ secrets.VPS_PATH }}
          DEPLOY_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 25m
          envs: VPS_PATH,DEPLOY_SHA
          script: |
            set -euo pipefail
            cd "${VPS_PATH:-/opt/bestway}"
            test -f ./backend-django/.env || { echo "backend-django/.env missing on VPS"; exit 1; }
            git config remote.origin.fetch "+refs/heads/*:refs/remotes/origin/*"
            git fetch origin main
            test "$(git rev-parse origin/main)" = "$DEPLOY_SHA" \
              || { echo "main advanced beyond the verified commit; wait for its CI"; exit 1; }
            git merge --ff-only origin/main || { echo "Checkout cannot fast-forward; deployment stopped without discarding local work"; exit 1; }
            echo "checkout fast-forwarded to $(git rev-parse --short HEAD)"
            export BUILD_COMMIT="$(git rev-parse HEAD)"
            # Workers share bestway-django:local with backend; build it once.
            echo "Building migrator, backend and frontend images"
            timeout 15m docker compose build db-migrator backend frontend
            echo "Starting services from the prebuilt images"
            timeout 5m docker compose up -d --no-build --wait --wait-timeout 180 backend frontend assessment-worker game-scheduler telegram-bot
            # Local gates (fatal): reach services over host loopback ports.
            curl -fsS --retry 25 --retry-delay 2 --retry-all-errors http://127.0.0.1:3001/v1/health > /dev/null
            curl -fsS --retry 25 --retry-delay 2 --retry-all-errors http://127.0.0.1:3005/ > /dev/null
            docker compose exec -T backend python manage.py seed_all_29_grammar_quizzes || true
            # Public gates (warn-only): fail before DNS cutover / tunnel setup.
            curl -fsS --max-time 30 https://api.bestwayec.uz/v1/health > /dev/null \
              || echo "WARN: public api.bestwayec.uz not reachable (DNS/tunnel pending?)"
            curl -fsS --max-time 30 https://bestwayec.uz/ > /dev/null \
              || echo "WARN: public bestwayec.uz not reachable (DNS/tunnel pending?)"
            docker compose ps
