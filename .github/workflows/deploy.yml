name: Deploy to VPS

# Single-VPS Docker + Cloudflare deploy. Runs AFTER CI is green.
# Trigger: successful main CI (or manual dispatch with a successful CI gate).
#
# Required GitHub secrets (repo Settings → Secrets → Actions):
#   VPS_HOST     — VPS IP or hostname (e.g. 203.0.113.10)
#   VPS_USER     — SSH user on VPS (e.g. deploy)
#   VPS_SSH_KEY  — private OpenSSH key for VPS_USER (no passphrase)
#   VPS_PATH     — repo path on VPS (default /opt/bestway if unset)

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: bestway-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require successful main CI for the deployment commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          gh api "repos/$REPO/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=100" \
            --jq '.workflow_runs[].head_sha' | grep -Fx "$DEPLOY_SHA" >/dev/null \
            || { echo "No successful main CI run for this commit; deployment blocked"; exit 1; }
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        env:
          VPS_PATH: ${{ secrets.VPS_PATH }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: VPS_PATH,DEPLOY_SHA
          script: |
            set -euo pipefail
            cd "${VPS_PATH:-/opt/bestway}"
            test -f ./backend-django/.env || { echo "backend-django/.env missing on VPS"; exit 1; }
            git config remote.origin.fetch "+refs/heads/*:refs/remotes/origin/*"
            git fetch origin main
            test "$(git rev-parse origin/main)" = "$DEPLOY_SHA" \
              || { echo "main advanced beyond the verified commit; wait for its CI"; exit 1; }
            if git merge --ff-only origin/main; then
              echo "checkout fast-forwarded to $(git rev-parse --short HEAD)"
            else
              echo "WARN: origin/main is not a fast-forward — history was rewritten upstream"
              echo "      checkout before: $(git rev-parse --short HEAD)"
              git reset --hard origin/main
              echo "      checkout after:  $(git rev-parse --short HEAD)"
            fi
            export BUILD_COMMIT="$(git rev-parse HEAD)"
            docker compose up -d --build backend frontend assessment-worker game-scheduler telegram-bot
            # Local gates (fatal): reach services over host loopback ports.
            curl -fsS --retry 25 --retry-delay 2 --retry-all-errors http://127.0.0.1:3001/v1/health > /dev/null
            curl -fsS --retry 25 --retry-delay 2 --retry-all-errors http://127.0.0.1:3005/ > /dev/null
            # Public gates (warn-only): fail before DNS cutover / tunnel setup.
            curl -fsS --max-time 30 https://api.bestwayec.uz/v1/health > /dev/null \
              || echo "WARN: public api.bestwayec.uz not reachable (DNS/tunnel pending?)"
            curl -fsS --max-time 30 https://bestwayec.uz/ > /dev/null \
              || echo "WARN: public bestwayec.uz not reachable (DNS/tunnel pending?)"
            docker image prune -f
            docker compose ps
