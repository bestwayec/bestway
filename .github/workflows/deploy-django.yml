name: Initial Django cutover

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full release commit SHA with successful CI
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: bestway-production-deploy
  cancel-in-progress: false

jobs:
  cutover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Verify the exact release passed CI
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEPLOY_SHA: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Full commit SHA required"; exit 1; }
          gh api "repos/$REPO/actions/workflows/ci.yml/runs?event=push&status=success&per_page=100" \
            --jq '.workflow_runs[] | select(.head_branch == "main" or .head_branch == "migration/django-backend") | .head_sha' \
            | grep -Fx "$DEPLOY_SHA" >/dev/null \
            || { echo "This release has no successful CI; cutover blocked"; exit 1; }
      - name: Back up, migrate and cut over on VPS
        uses: appleboy/ssh-action@v1
        env:
          VPS_PATH: ${{ secrets.VPS_PATH }}
          DEPLOY_SHA: ${{ inputs.commit }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: VPS_PATH,DEPLOY_SHA
          script: |
            set -euo pipefail
            [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
            cd "${VPS_PATH:-/opt/bestway}"
            git diff --quiet && git diff --cached --quiet || { echo "VPS checkout has tracked changes"; exit 1; }
            previous_sha="$(git rev-parse HEAD)"
            git fetch origin "$DEPLOY_SHA"
            git checkout --detach "$DEPLOY_SHA"
            if ! bash backend-django/scripts/deploy_django.sh "$DEPLOY_SHA"; then
              git checkout --detach "$previous_sha"
              echo "Cutover failed; restored previous source checkout. Inspect retained backup and logs."
              exit 1
            fi
